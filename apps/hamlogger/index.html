<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ham Logger</title>
    <meta name="robots" content="noindex">

    <!-- Ham Logger now lives at its own site, https://www.hamlogger.app/. This
         page used to host the app's landing content; it forwards there. The
         sibling files (privacy.html, tos.html) are left in place since store
         listings and old links point at them directly. -->
    <script>
        location.replace("https://www.hamlogger.app/");
    </script>

    <!-- No-JS fallback. -->
    <meta http-equiv="refresh" content="0; url=https://www.hamlogger.app/">
    <link rel="canonical" href="https://www.hamlogger.app/">
</head>
<body>
    <p>Redirecting… If you are not redirected,
        <a href="https://www.hamlogger.app/">open Ham Logger</a>.</p>
</body>
</html>
